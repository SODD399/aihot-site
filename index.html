<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Hot Site</title>
<style>
:root{
  --bg:#f7f4ec;
  --surface:#fffdf7;
  --panel:#fffaf0;
  --panel-strong:#fff2bd;
  --text:#2a2318;
  --muted:#746b5c;
  --faint:#a69b87;
  --line:#eadfca;
  --line-strong:#d8c6a5;
  --brand:#f4b000;
  --brand-strong:#d99000;
  --brand-soft:#fff4c8;
  --ink:#201a12;
  --nav:#17140f;
  --nav-2:#2b251a;
  --blue:#3167d8;
  --green:#168a5b;
  --red:#d64a3a;
  --teal:#0f8c90;
  --orange:#ed7a1f;
  --purple:#7d55c7;
  --shadow:0 1px 2px rgba(32,26,18,.06),0 10px 30px rgba(32,26,18,.08);
  --radius:8px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif;line-height:1.5}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--nav) 0%,var(--nav-2) 100%);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{width:40px;height:40px;border-radius:8px;background:var(--brand);color:#1e1607;display:grid;place-items:center;font-weight:900}
.brand-title{font-size:16px;font-weight:800;letter-spacing:0}
.brand-sub{font-size:12px;color:rgba(255,255,255,.58);margin-top:2px}
.nav-group{display:flex;flex-direction:column;gap:6px}
.nav-label{padding:0 8px 4px;font-size:11px;color:rgba(255,255,255,.45);font-weight:700}
.nav-item{width:100%;border:0;background:transparent;color:rgba(255,255,255,.76);display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--brand);color:#211604;font-weight:800}
.nav-icon{width:22px;text-align:center}
.subnav{display:none;margin:2px 0 8px 32px;padding-left:10px;border-left:1px solid rgba(255,255,255,.16)}
.subnav.open{display:grid;gap:4px}
.subnav-label{font-size:10px;color:rgba(255,255,255,.38);font-weight:800;margin:8px 0 2px}
.subnav-item{border:0;background:transparent;color:rgba(255,255,255,.62);border-radius:7px;padding:8px 9px;text-align:left;font-size:12px}
.subnav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.subnav-item.active{background:rgba(244,176,0,.18);color:#ffd36a;font-weight:850}
.sidebar-foot{margin-top:auto;padding:12px 8px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.58)}

.shell{min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:rgba(255,253,247,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}
.page-title{display:flex;align-items:center;gap:12px;min-width:0}
.page-title h1{margin:0;font-size:20px;line-height:1.2}
.page-title span{font-size:12px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px}
.status-pill{height:32px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-online{background:var(--green)}.dot-offline{background:var(--red)}
.count-badge{height:32px;display:flex;align-items:center;padding:0 11px;border-radius:999px;background:var(--brand-soft);border:1px solid #ecd787;color:#66501b;font-size:12px;font-weight:700}
.btn-logout{height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px}
.btn-logout:hover{border-color:var(--line-strong);color:var(--text)}

.content{padding:22px 26px 28px;min-width:0}
.module{display:none}.module.active{display:block}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.metric-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.metric-value{font-size:24px;font-weight:850;line-height:1;color:var(--ink)}
.metric-note{font-size:11px;color:var(--faint);margin-top:6px}

.workspace{display:grid;grid-template-columns:minmax(420px,46%) minmax(0,1fr);gap:16px;align-items:start}
.column{min-width:0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 10px}
.section-head h2{font-size:15px;margin:0;color:var(--ink)}
.section-head span{font-size:12px;color:var(--faint)}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-pad{padding:16px}

.tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:750}
.tab:hover{background:#fff;border-color:var(--line)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.right-content{max-height:calc(100vh - 190px);overflow:auto;padding:14px}
.right-content::-webkit-scrollbar,.feed::-webkit-scrollbar{width:8px}
.right-content::-webkit-scrollbar-thumb,.feed::-webkit-scrollbar-thumb{background:#dac9aa;border-radius:999px}
.feed{max-height:calc(100vh - 228px);overflow:auto;padding-right:4px}

.hotspot-item,.event-item,.gen-card,.auto-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.hotspot-item:hover,.event-item:hover,.gen-card:hover,.auto-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.item-head,.gen-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.type-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.type-label,.chip,.gen-type,.gen-style{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;line-height:1.3}
.type-ai .type-dot{background:var(--blue)}.type-ai .type-label{background:#e9efff;color:var(--blue)}
.type-finance .type-dot{background:var(--red)}.type-finance .type-label{background:#ffebe8;color:var(--red)}
.type-ecommerce .type-dot{background:var(--green)}.type-ecommerce .type-label{background:#e9f7ef;color:var(--green)}
.type-worldcup .type-dot{background:var(--orange)}.type-worldcup .type-label{background:#fff0df;color:var(--orange)}
.type-seasonal .type-dot{background:var(--purple)}.type-seasonal .type-label{background:#f1eafd;color:var(--purple)}
.type-industry .type-dot{background:var(--teal)}.type-industry .type-label{background:#e4f6f7;color:var(--teal)}
.item-date,.gen-time{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.item-title,.event-title,.gen-title{font-weight:800;color:var(--ink);line-height:1.45}
.item-title{font-size:14px;margin-bottom:5px}.event-title{font-size:14px;margin-bottom:6px}.gen-title{font-size:15px;margin-bottom:10px}
.item-summary,.event-summary{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-source{font-size:11px;color:var(--faint);margin-bottom:11px}
.event-item{border-left:4px solid var(--brand)}
.event-item.warning{border-left-color:var(--red);background:#fff9f7}
.event-date{font-size:12px;color:var(--brand-strong);font-weight:850;margin-bottom:6px}
.event-item.warning .event-date{color:var(--red)}
.item-actions,.gen-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm,.btn-primary,.btn-secondary,.btn-copy{border-radius:7px;border:1px solid transparent;font-weight:800;transition:background .15s,border-color .15s,color .15s}
.btn-sm{height:30px;padding:0 10px;font-size:12px;background:#fff;border-color:var(--line);color:var(--text)}
.btn-sm:hover{border-color:var(--brand);background:var(--brand-soft)}
.btn-gen{border-color:#e4c66a;color:#624711;background:#fffdf6}
.btn-gen.matrix{border-color:#f0b184;color:#8b3f10;background:#fff7ef}
.btn-gen:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{height:38px;padding:0 16px;background:var(--ink);color:#fff}
.btn-primary:hover{background:#3a2f21}
.btn-secondary{height:38px;padding:0 14px;background:#fff;color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--line-strong);background:var(--brand-soft)}
.btn-copy{height:32px;padding:0 12px;background:#fff;color:var(--muted);border-color:var(--line)}
.btn-copy:hover{color:var(--ink);border-color:var(--line-strong)}
.gen-type-wechat{background:#e9efff;color:var(--blue)}
.gen-type-xiaohongshu{background:#ffebe8;color:var(--red)}
.gen-type-copywriting{background:#e9f7ef;color:var(--green)}
.gen-type-script{background:#fff2bd;color:#745300}
.gen-style-official{background:#fff2bd;color:#745300}
.gen-style-matrix{background:#fff0df;color:#9a4a13}
.gen-content{font-size:14px;line-height:1.85;color:#3f3629;white-space:pre-wrap;word-break:break-word;max-height:430px;overflow:auto;padding-right:6px}
.gen-actions{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}

.copywriting-input{display:grid;gap:12px;margin-bottom:14px}
.copywriting-input label{font-size:13px;font-weight:850;color:var(--ink)}
.url-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.copywriting-input input[type=url],.copywriting-input textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;color:var(--text);outline:none}
.copywriting-input textarea{min-height:130px;resize:vertical}
.copywriting-input input:focus,.copywriting-input textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(244,176,0,.16)}
.check-row{display:flex!important;align-items:center;gap:8px;color:var(--muted);font-weight:700!important}
.extract-status{font-size:12px;min-height:18px;color:var(--faint)}
.extract-status.success{color:var(--green)}.extract-status.error{color:var(--red)}

.automation-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:start}
.auto-hero{background:linear-gradient(135deg,#201a12 0%,#4a3512 62%,#aa7600 100%);color:#fff;border-radius:var(--radius);padding:18px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px;min-height:116px}
.auto-hero h2{margin:0 0 6px;font-size:21px}
.auto-hero p{margin:0;color:rgba(255,255,255,.72);font-size:13px;max-width:680px}
.auto-hero .btn-primary{background:var(--brand);color:#211604}
.auto-hero .btn-primary:hover{background:#ffc83a}
.account-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:14px}
.account-switcher{display:flex;gap:8px;flex-wrap:wrap}
.account-filter{height:34px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:0 12px;font-size:12px;font-weight:850}
.account-filter:hover{border-color:var(--line-strong);color:var(--ink)}
.account-filter.active{background:var(--ink);border-color:var(--ink);color:#fff}
.workflow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step-card{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:10px;font-weight:900;color:#7a5700;flex:0 0 auto}
.step-card h3{font-size:12px;margin:0;color:var(--ink)}
.step-card p{display:none}
.auto-card h3{margin:0 0 10px;font-size:14px;color:var(--ink)}
.auto-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.auto-card-head h3{margin:0}
.auto-note{font-size:12px;color:var(--faint)}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task-row:first-of-type{border-top:0;padding-top:0}
.task-title{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.task-meta{font-size:12px;color:var(--faint);margin-top:2px}
.task-fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.field-pill{font-size:11px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 8px}
.field-pill.done{background:#e9f7ef;border-color:#b9e3cb;color:var(--green)}
.field-pill.warn{background:#fff0df;border-color:#f2cfac;color:var(--orange)}
.chip{background:#f2eadb;color:var(--muted)}
.chip.green{background:#e9f7ef;color:var(--green)}.chip.orange{background:#fff0df;color:var(--orange)}.chip.red{background:#ffebe8;color:var(--red)}
.account-list{display:grid;gap:10px}
.account{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;font-weight:900}
.account strong{display:block;font-size:13px}.account span{display:block;font-size:12px;color:var(--faint)}
.rule-list{display:grid;gap:8px}
.rule-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:9px;font-size:12px;color:var(--muted)}
.rule-item:first-child{border-top:0;padding-top:0}
.automation-head{background:linear-gradient(135deg,#201a12 0%,#4a3512 66%,#aa7600 100%);color:#fff;border-radius:var(--radius);padding:18px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}
.automation-head h2{margin:0 0 6px;font-size:20px}
.automation-head p{margin:0;color:rgba(255,255,255,.72);font-size:13px;max-width:760px}
.automation-head .btn-primary{background:var(--brand);color:#211604}
.automation-head .btn-primary:hover{background:#ffc83a}
.automation-content{display:grid;gap:14px}
.page-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
.table-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.table-row{display:grid;grid-template-columns:1.3fr .8fr .9fr .9fr auto;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);font-size:13px}
.table-row:first-child{border-top:0;background:var(--panel);font-size:12px;color:var(--muted);font-weight:850}
.table-row strong{color:var(--ink)}
.comment-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;border-top:1px solid var(--line);padding:12px 0}
.comment-card:first-of-type{border-top:0;padding-top:0}
.comment-text{font-size:13px;color:var(--ink);font-weight:800}
.draft{margin-top:6px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}

.loading,.empty-state{text-align:center;color:var(--faint);padding:46px 14px}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;z-index:1000;box-shadow:var(--shadow)}

@media(max-width:1080px){
  .app{grid-template-columns:86px minmax(0,1fr)}
  .brand-text,.nav-label,.nav-text,.sidebar-foot,.subnav{display:none}
  .brand{justify-content:center}.nav-item{justify-content:center}
  .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .workspace,.automation-grid,.page-grid{grid-template-columns:1fr}
  .span-12,.span-8,.span-6,.span-4{grid-column:span 1}
  .feed,.right-content{max-height:none}
}
@media(max-width:720px){
  .app{display:block}
  .sidebar{position:sticky;top:0;z-index:30;flex-direction:row;align-items:center;overflow:auto;padding:10px}
  .brand{border-bottom:0;padding:0}.nav-group{flex-direction:row}.nav-label,.sidebar-foot{display:none}
  .nav-text{display:inline}.nav-item{white-space:nowrap}
  .subnav.open{display:flex;margin:0;border-left:0;padding-left:0;gap:6px}
  .subnav-label{display:none}.subnav-item{white-space:nowrap}
  .topbar{height:auto;align-items:flex-start;gap:12px;flex-direction:column;padding:14px}
  .top-actions{flex-wrap:wrap}.content{padding:14px}
  .auto-hero,.automation-head{align-items:flex-start;flex-direction:column}
  .auto-hero .btn-primary,.automation-head .btn-primary{width:100%;white-space:nowrap}
  .table-row{grid-template-columns:1fr;gap:5px}
  .summary-grid,.workflow{grid-template-columns:1fr}
  .url-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div class="brand-text">
        <div class="brand-title">AI Hot Site</div>
        <div class="brand-sub">内容生产与运营中台</div>
      </div>
    </div>
    <div class="nav-group">
      <div class="nav-label">工作区</div>
      <button class="nav-item active" data-module="hotspot"><span class="nav-icon">H</span><span class="nav-text">热点内容</span></button>
      <button class="nav-item" data-module="automation"><span class="nav-icon">D</span><span class="nav-text">自动化运营</span></button>
      <div class="subnav" id="automationSubnav">
        <button class="subnav-item active" data-auto-page="overview" data-account="全部账号">全景总览</button>
        <div class="subnav-label">已连接账号</div>
        <button class="subnav-item" data-auto-page="overview" data-account="品牌官方号">品牌官方号</button>
        <button class="subnav-item" data-auto-page="overview" data-account="矩阵号 A">矩阵号 A</button>
        <button class="subnav-item" data-auto-page="overview" data-account="矩阵号 B">矩阵号 B</button>
        <button class="subnav-item" data-auto-page="overview" data-account="矩阵号 C">矩阵号 C</button>
        <div class="subnav-label">运营页面</div>
        <button class="subnav-item" data-auto-page="accounts">账号连接</button>
        <button class="subnav-item" data-auto-page="publish">发布中心</button>
        <button class="subnav-item" data-auto-page="comments">评论收件箱</button>
        <button class="subnav-item" data-auto-page="opportunities">互动机会池</button>
        <button class="subnav-item" data-auto-page="rules">规则与风控</button>
      </div>
    </div>
    <div class="sidebar-foot">生产环境 · 团队登录</div>
  </aside>

  <main class="shell">
    <header class="topbar">
      <div class="page-title">
        <div>
          <h1 id="moduleTitle">热点内容</h1>
          <span id="moduleSubtitle">热点追踪、节点预警、多平台内容生成</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="status-pill" id="aiStatus"><span class="dot dot-offline"></span>检测中...</span>
        <span id="countBadge" class="count-badge">加载中</span>
        <button id="logoutBtn" class="btn-logout" onclick="logout()" style="display:none">退出</button>
      </div>
    </header>

    <div class="content">
      <section class="module active" id="module-hotspot">
        <div class="summary-grid">
          <div class="metric"><div class="metric-label">近 3 天热点</div><div class="metric-value" id="metricHotspots">-</div><div class="metric-note">可直接生成内容</div></div>
          <div class="metric"><div class="metric-label">未来节点</div><div class="metric-value" id="metricEvents">-</div><div class="metric-note">提前储备选题</div></div>
          <div class="metric"><div class="metric-label">生成历史</div><div class="metric-value" id="metricGenerated">-</div><div class="metric-note">团队复用资产</div></div>
          <div class="metric"><div class="metric-label">AI 状态</div><div class="metric-value" id="metricAi">-</div><div class="metric-note">DeepSeek / easycode</div></div>
        </div>

        <div class="workspace">
          <div class="column">
            <div class="section-head"><h2>热点与节点池</h2><span id="poolHint">按时间排序</span></div>
            <div class="feed">
              <div class="section-head"><h2>今日热点</h2><span>近 3 天</span></div>
              <div class="stack" id="hotspotList"><div class="loading"><div class="spinner"></div>加载热点...</div></div>
              <div class="section-head" style="margin-top:16px"><h2>专题节点</h2><span>未来 1 月+</span></div>
              <div class="stack" id="eventList"><div class="loading"><div class="spinner"></div>加载节点...</div></div>
            </div>

      <section class="module" id="module-automation">

            <h2 id="automationPageTitle">全景总览 · 全部账号</h2>
            <p id="automationPageSubtitle">按左侧账号或页面进入对应工作区；每个页面都围绕当前账号呈现任务。</p>
          </div>
          <button class="btn-primary" onclick="toast('抖音授权接入将在下一阶段配置')">连接抖音账号</button>
        </div>
        <div class="automation-content" id="automationContent"></div>
      </section>
    </div>
  </main>
</div>

<script>
function getDemoHotspots(){
  var t=new Date().toISOString().split('T')[0];
  var y=new Date(Date.now()-86400000).toISOString().split('T')[0];
  return [
    {id:'h1',type:'ai',date:t,time:'08:30',title:'DeepSeek V4 发布，推理能力全面超越 GPT-5，开源社区沸腾',source:'36氪',sourceUrl:'https://36kr.com',summary:'DeepSeek 最新模型在多项基准测试中超越 GPT-5，且完全开源。中小企业也能用上顶级 AI。'},
    {id:'h2',type:'ai',date:t,time:'07:00',title:'Anthropic 发布 Claude Opus 4.5，企业级 AI 助手新标杆',source:'TechCrunch',sourceUrl:'https://techcrunch.com',summary:'新一代模型大幅提升推理和代码能力，API 价格同步下调 50%。'},
    {id:'h3',type:'finance',date:t,time:'09:00',title:'A股成交额突破2万亿，AI概念股领涨',source:'华尔街见闻',sourceUrl:'https://wallstreetcn.com',summary:'市场情绪高涨，北向资金大幅流入，科技板块成为最大赢家。'},
    {id:'h4',type:'finance',date:t,time:'10:30',title:'比特币突破15万美元，机构投资者加速入场',source:'Bloomberg',sourceUrl:'https://bloomberg.com',summary:'多家华尔街机构获批加密货币托管业务，比特币创历史新高。'},
    {id:'h5',type:'ecommerce',date:t,time:'08:00',title:'TikTok Shop 东南亚单日GMV破10亿美元',source:'虎嗅',sourceUrl:'https://huxiu.com',summary:'直播电商在东南亚爆发式增长，MCN 机构和品牌加速入局。'},
    {id:'h6',type:'ecommerce',date:y,time:'16:00',title:'SHEIN 秘密提交伦敦IPO申请，估值超800亿美元',source:'Financial Times',sourceUrl:'https://ft.com',summary:'快时尚巨头加速全球化扩张，伦敦上市将成今年最大 IPO。'}
  ];
}
function getDemoEvents(){
  return [
    {id:'e1',type:'worldcup',date:'2026-07-29',title:'世界杯复盘选题',source:'内容日历',summary:'适合做赛后复盘、热点借势和评论区互动话术。',isWarning:false},
    {id:'e2',type:'seasonal',date:'2026-08-05',title:'七夕营销节点',source:'营销日历',summary:'七夕前需完成方案。方向：社交、电商、礼品行业文案和活动策划。',isWarning:false},
    {id:'e3',type:'industry',date:'2026-08-15',title:'开学季预热 · 学习工具推广',source:'行业提醒',summary:'预警：学习类 App 和教辅机构应开始布局开学季内容。',isWarning:true}
  ];
}

var currentTab='wechat';
var currentModule='hotspot';
var currentAutoPage='overview';
var selectedAutoAccount='全部账号';
var hotspots=[];
var events=[];
var generated=[];
var aiReady=false;
var generating=false;

function apiFetch(url,opts){
  return fetch(url,opts).then(function(r){
    if(r.status===401){
      window.location.href='/login';
      throw new Error('unauthorized');
    }
    return r;
  });
}

function init(){
  setupNavigation();
  setupAutomation();
  setupTabs();
  renderAutomationPage();
  checkStatus().then(function(){
    return Promise.all([loadHotspots(),loadEvents(),loadGenerated()]);
  });
}

function checkStatus(){
  return apiFetch('/api/status').then(function(r){return r.json();}).then(function(status){
    aiReady=status.ai_ready;
    updateStatusUI(status);
  }).catch(function(){
    aiReady=false;
    updateStatusUI({ai_ready:false,backend:'demo',auth_enabled:false,counts:{hotspots:7,events:3,generated:0}});
  });
}

function updateStatusUI(status){
  var online=status.ai_ready;
  document.getElementById('aiStatus').innerHTML='<span class="dot '+(online?'dot-online':'dot-offline')+'"></span>'+(online?'AI 就绪':'演示 / 未配置');
  var counts=status.counts||{};
  document.getElementById('countBadge').textContent='热点 '+(counts.hotspots||0)+' · 节点 '+(counts.events||0)+' · 历史 '+(counts.generated||0);
  document.getElementById('metricHotspots').textContent=counts.hotspots||0;
  document.getElementById('metricEvents').textContent=counts.events||0;
  document.getElementById('metricGenerated').textContent=counts.generated||0;
  document.getElementById('metricAi').textContent=online?'就绪':'未配';
  var logoutBtn=document.getElementById('logoutBtn');
  if(logoutBtn)logoutBtn.style.display=status.auth_enabled?'inline-block':'none';
}

function loadHotspots(){
  return apiFetch('/api/hotspots').then(function(r){return r.json();}).then(function(data){hotspots=data;}).catch(function(){hotspots=getDemoHotspots();}).then(renderHotspots);
}
function loadEvents(){
  return apiFetch('/api/events').then(function(r){return r.json();}).then(function(data){events=data;}).catch(function(){events=getDemoEvents();}).then(renderEvents);
}
function loadGenerated(){
  return apiFetch('/api/generated').then(function(r){return r.json();}).then(function(data){generated=data;}).catch(function(){}).then(renderRightPanel);
}

function renderHotspots(){
  var el=document.getElementById('hotspotList');
  if(!hotspots.length){el.innerHTML='<div class="empty-state"><p>暂无近 3 天热点。可以先刷新数据或使用节点池。</p></div>';return;}
  var typeLabel={ai:'AI',finance:'金融',ecommerce:'电商',worldcup:'世界杯',seasonal:'节日',industry:'行业'};
  var html='';
  for(var i=0;i<hotspots.length;i++){
    var h=hotspots[i],tl=typeLabel[h.type]||h.type||'热点';
    html+='<div class="hotspot-item type-'+escapeAttr(h.type||'industry')+'">';
    html+='<div class="item-head"><span class="type-dot"></span><span class="type-label">'+escapeHtml(tl)+'</span><span class="item-date">'+escapeHtml(h.date||'')+' '+escapeHtml(h.time||'')+'</span></div>';
    html+='<div class="item-title">'+escapeHtml(h.title)+'</div>';
    if(h.summary)html+='<div class="item-summary">'+escapeHtml(h.summary)+'</div>';
    html+='<div class="item-source">'+escapeHtml(h.source||'未知来源')+'</div>';
    html+='<div class="item-actions">';
    html+='<button class="btn-sm btn-gen" onclick="doGenerate(\''+escapeAttr(h.id)+'\',\'wechat\',\'official\')" '+(aiReady?'':'disabled')+'>官号推文</button>';
    html+='<button class="btn-sm btn-gen matrix" onclick="doGenerate(\''+escapeAttr(h.id)+'\',\'xiaohongshu\',\'matrix\')" '+(aiReady?'':'disabled')+'>矩阵图文</button>';
    html+='<button class="btn-sm btn-gen" onclick="doGenerate(\''+escapeAttr(h.id)+'\',\'script\',\'matrix\')" '+(aiReady?'':'disabled')+'>脚本文案</button>';
    html+='</div></div>';
  }
  el.innerHTML=html;
}

function renderEvents(){
  var el=document.getElementById('eventList');
  if(!events.length){el.innerHTML='<div class="empty-state"><p>暂无未来节点。</p></div>';return;}
  var typeLabel={worldcup:'世界杯',seasonal:'节日/季节',industry:'行业',holiday:'假期'};
  var html='';
  for(var i=0;i<events.length;i++){
    var e=events[i],tl=typeLabel[e.type]||e.type||'节点';
    html+='<div class="event-item type-'+escapeAttr(e.type||'industry')+(e.isWarning?' warning':'')+'">';
    html+='<div class="event-date">'+escapeHtml(e.date||'')+' · '+escapeHtml(tl)+'</div>';
    html+='<div class="event-title">'+escapeHtml(e.title)+'</div>';
    if(e.summary)html+='<div class="event-summary">'+escapeHtml(e.summary)+'</div>';
    if(!e.isWarning){
      html+='<div class="item-actions">';
      html+='<button class="btn-sm btn-gen" onclick="doGenerate(\''+escapeAttr(e.id)+'\',\'wechat\',\'official\')" '+(aiReady?'':'disabled')+'>官号推文</button>';
      html+='<button class="btn-sm btn-gen matrix" onclick="doGenerate(\''+escapeAttr(e.id)+'\',\'xiaohongshu\',\'matrix\')" '+(aiReady?'':'disabled')+'>矩阵图文</button>';
      html+='<button class="btn-sm btn-gen" onclick="doGenerate(\''+escapeAttr(e.id)+'\',\'script\',\'matrix\')" '+(aiReady?'':'disabled')+'>脚本文案</button>';
      html+='</div>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

function doGenerate(itemId,genType,style){
  if(generating)return;
  var item=hotspots.find(function(h){return h.id===itemId;})||events.find(function(e){return e.id===itemId;});
  if(!item){toast('找不到该条目');return;}
  if(!aiReady){toast('AI 未配置，请检查环境变量');return;}
  generating=true;
  var styleLabel=style==='official'?'官号':'矩阵号';
  var typeLabel=genType==='wechat'?'公众号推文':genType==='script'?'脚本文案':'矩阵图文';
  toast('正在生成 '+styleLabel+typeLabel+'...');
  document.getElementById('rightContent').innerHTML='<div class="loading"><div class="spinner"></div><p>AI 正在生成 '+styleLabel+typeLabel+'...</p><p style="font-size:12px;color:var(--faint)">这可能需要 20-60 秒</p></div>';
  apiFetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:item,type:genType,style:style})})
    .then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.error||'生成失败')});return r.json();})
    .then(function(result){generated.unshift(result);renderRightPanel();toast('生成完成');})
    .catch(function(e){toast(e.message||'网络错误');})
    .finally(function(){generating=false;});
}

function renderRightPanel(){
  var el=document.getElementById('rightContent');
  if(currentTab==='copywriting'){renderCopywritingTab(el);return;}
  var filtered=generated.filter(function(g){return g.type===currentTab;});
  if(!filtered.length){el.innerHTML='<div class="empty-state"><p>暂无'+(currentTab==='wechat'?'公众号推文':currentTab==='script'?'脚本文案':'矩阵图文')+'，从左侧选题生成。</p></div>';return;}
  var typeLabels={wechat:'公众号推文',xiaohongshu:'矩阵图文',script:'脚本文案',copywriting:'文案改写'};
  var html='';
  for(var i=0;i<filtered.length;i++){
    var g=filtered[i];
    html+='<div class="gen-card">';
    html+='<div class="gen-head"><span class="gen-type gen-type-'+escapeAttr(g.type)+'">'+typeLabels[g.type]+'</span><span class="gen-style gen-style-'+escapeAttr(g.style)+'">'+(g.style==='official'?'官号':'矩阵号')+'</span><span class="gen-time">'+formatTime(g.timestamp)+'</span></div>';
    html+='<div class="gen-title">'+escapeHtml(g.title)+'</div>';
    html+='<div class="gen-content" id="content-'+escapeAttr(g.id)+'">'+formatContent(g.content)+'</div>';
    html+='<div class="gen-actions"><button class="btn-copy" onclick="copyContent(\''+escapeAttr(g.id)+'\')">复制全文</button></div></div>';
  }
  el.innerHTML=html;
}

function renderCopywritingTab(el){
  el.innerHTML='<div class="copywriting-input">'+
    '<div class="auto-note">这里处理外部链接或手动粘贴的洗稿；如果要基于左侧热点/节点生成脚本文案，直接点左侧「脚本文案」。</div>'+
    '<label>链接文案提取</label>'+
    '<div class="url-row"><input type="url" id="douyinUrl" placeholder="粘贴公开视频、文章或社媒链接">'+
    '<button class="btn-secondary" onclick="extractDouyin()" '+(aiReady?'':'disabled')+'>提取</button></div>'+
    '<div class="extract-status" id="extractStatus"></div>'+
    '<label>原始文案</label>'+
    '<textarea id="sourceText" placeholder="粘贴需要洗稿的原始文案"></textarea>'+
    '<label class="check-row"><input type="checkbox" id="includeEasyClaw" checked>结合 EasyClaw 产品功能</label>'+
    '<div class="item-actions"><button class="btn-primary" onclick="doCopywriting(\'official\')" '+(aiReady?'':'disabled')+'>洗成官号文案</button>'+
    '<button class="btn-primary" onclick="doCopywriting(\'matrix\')" '+(aiReady?'':'disabled')+'>洗成矩阵号文案</button></div></div>'+
    renderCopywritingResults();
}

function renderCopywritingResults(){
  var filtered=generated.filter(function(g){return g.type==='copywriting';});
  if(!filtered.length)return'';
  var html='<div class="stack">';
  for(var i=0;i<filtered.length;i++){
    var g=filtered[i];
    html+='<div class="gen-card"><div class="gen-head"><span class="gen-type gen-type-copywriting">文案改写</span><span class="gen-style gen-style-'+escapeAttr(g.style)+'">'+(g.style==='official'?'官号':'矩阵号')+'</span><span class="gen-time">'+formatTime(g.timestamp)+'</span></div><div class="gen-title">'+escapeHtml(g.title||'未命名')+'</div><div class="gen-content" id="content-'+escapeAttr(g.id)+'">'+formatContent(g.content)+'</div><div class="gen-actions"><button class="btn-copy" onclick="copyContent(\''+escapeAttr(g.id)+'\')">复制全文</button></div></div>';
  }
  return html+'</div>';
}

function extractDouyin(){
  var url=document.getElementById('douyinUrl').value.trim();
  if(!url){toast('请先粘贴链接');return;}
  var status=document.getElementById('extractStatus');
  status.textContent='正在提取...';status.className='extract-status';
  apiFetch('/api/extract-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})})
    .then(function(r){return r.json();})
    .then(function(result){
      if(result.success){
        status.textContent='提取成功，文案已填入下方';status.className='extract-status success';
        document.getElementById('sourceText').value=result.text;
      }else{
        status.textContent=(result.error||'提取失败')+' · '+(result.hint||'请手动粘贴文案');
        status.className='extract-status error';
      }
    }).catch(function(){status.textContent='网络错误';status.className='extract-status error';});
}

function doCopywriting(style){
  var text=document.getElementById('sourceText').value.trim();
  if(!text){toast('请先输入或提取文案');return;}
  if(!aiReady){toast('AI 未配置，请检查环境变量');return;}
  toast('正在洗稿改写...');
  apiFetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:{id:'copy_manual',title:text,type:'copywriting',source:'用户输入'},type:'copywriting',style:style,text:text,includeEasyClaw:(document.getElementById('includeEasyClaw')?document.getElementById('includeEasyClaw').checked:true)})})
    .then(function(r){return r.json();})
    .then(function(result){generated.unshift(result);renderRightPanel();toast('洗稿完成');})
    .catch(function(){toast('生成失败');});
}

function setupTabs(){
  document.getElementById('rightTabs').addEventListener('click',function(e){
    var tab=e.target.closest('.tab');
    if(!tab)return;
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
    tab.classList.add('active');
    currentTab=tab.dataset.tab;
    renderRightPanel();
  });
}

function setupNavigation(){
  document.querySelector('.sidebar').addEventListener('click',function(e){
    var sub=e.target.closest('.subnav-item');
    if(sub){
      setAutomationView(sub.dataset.autoPage||'overview',sub.dataset.account||selectedAutoAccount,sub);
      return;
    }
    var item=e.target.closest('.nav-item');
    if(!item)return;
    var target=item.dataset.module;
    currentModule=target;
    document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n===item);});
    document.querySelectorAll('.module').forEach(function(m){m.classList.remove('active');});
    document.getElementById('module-'+target).classList.add('active');
    var subnav=document.getElementById('automationSubnav');
    if(subnav)subnav.classList.toggle('open',target==='automation');
    document.getElementById('moduleTitle').textContent=target==='hotspot'?'热点内容':'自动化运营';
    document.getElementById('moduleSubtitle').textContent=target==='hotspot'?'热点追踪、节点预警、多平台内容生成':'抖音发布、评论维护、机会池管理';
    if(target==='automation')renderAutomationPage();
  });
}

function setupAutomation(){
  renderAutomationPage();
}

function setAutomationView(page,account,sourceEl){
  currentAutoPage=page||'overview';
  selectedAutoAccount=account||selectedAutoAccount||'全部账号';
  currentModule='automation';
  document.querySelectorAll('.module').forEach(function(m){m.classList.remove('active');});
  document.getElementById('module-automation').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.module==='automation');});
  var subnav=document.getElementById('automationSubnav');
  if(subnav)subnav.classList.add('open');
  document.querySelectorAll('.subnav-item').forEach(function(n){n.classList.toggle('active',n===sourceEl);});
  document.getElementById('moduleTitle').textContent='自动化运营';
  document.getElementById('moduleSubtitle').textContent='抖音发布、评论维护、互动机会池';
  renderAutomationPage();
}

function renderAutomationPage(){
  var el=document.getElementById('automationContent');
  if(!el)return;
  var titles={overview:'全景总览',accounts:'账号连接',publish:'发布中心',comments:'评论收件箱',opportunities:'互动机会池',rules:'规则与风控'};
  var title=(titles[currentAutoPage]||'全景总览')+' · '+selectedAutoAccount;
  document.getElementById('automationPageTitle').textContent=title;
  var sub='当前账号：'+selectedAutoAccount+'。左侧可以切换账号或进入具体运营页面。';
  if(currentAutoPage==='opportunities')sub='互动机会池来自抖音作品、博主和评论区，不等同于热点内容池。';
  if(currentAutoPage==='publish')sub='集中管理视频上传、文案、标签、封面、组件和发布时间。';
  if(currentAutoPage==='comments')sub='集中处理作品评论、AI 候选回复和高意向咨询。';
  document.getElementById('automationPageSubtitle').textContent=sub;
  if(currentAutoPage==='accounts')el.innerHTML=renderAccountsPage();
  else if(currentAutoPage==='publish')el.innerHTML=renderPublishPage();
  else if(currentAutoPage==='comments')el.innerHTML=renderCommentsPage();
  else if(currentAutoPage==='opportunities')el.innerHTML=renderOpportunitiesPage();
  else if(currentAutoPage==='rules')el.innerHTML=renderRulesPage();
  else el.innerHTML=renderAutomationOverview();
}

function renderAutomationOverview(){
  return '<div class="page-grid">'+
    '<div class="auto-card span-12"><div class="auto-card-head"><h3>账号全景</h3><span class="auto-note">左侧账号切换会改变本页视角</span></div><div class="account-list">'+accountRows()+'</div></div>'+
    '<div class="auto-card span-4"><h3>待发布</h3><div class="metric"><div class="metric-value">2</div><div class="metric-note">含 1 条待封面、1 条待定时</div></div></div>'+
    '<div class="auto-card span-4"><h3>待回复评论</h3><div class="metric"><div class="metric-value">4</div><div class="metric-note">含 1 条高意向咨询</div></div></div>'+
    '<div class="auto-card span-4"><h3>待确认互动机会</h3><div class="metric"><div class="metric-value">8</div><div class="metric-note">热门作品、新作品、评论区机会</div></div></div>'+
    '<div class="auto-card span-6"><div class="auto-card-head"><h3>发布中心摘要</h3><button class="btn-secondary" onclick="setAutomationView(&quot;publish&quot;,selectedAutoAccount)">进入发布中心</button></div>'+publishRows(true)+'</div>'+
    '<div class="auto-card span-6"><div class="auto-card-head"><h3>互动机会池摘要</h3><button class="btn-secondary" onclick="setAutomationView(&quot;opportunities&quot;,selectedAutoAccount)">进入机会池</button></div>'+opportunityRows(true)+'</div>'+
  '</div>';
}

function renderAccountsPage(){
  return '<div class="auto-card"><div class="auto-card-head"><h3>账号连接</h3><span class="auto-note">授权成功后账号会出现在左侧 D 自动化运营下方</span></div><div class="account-list">'+accountRows()+'</div></div>';
}

function renderPublishPage(){
  return '<div class="auto-card"><div class="auto-card-head"><h3>发布中心 · '+escapeHtml(selectedAutoAccount)+'</h3><button class="btn-primary" onclick="toast(&quot;创建发布任务将在下一阶段接入&quot;)">新建发布任务</button></div><div class="table-card"><div class="table-row"><span>视频任务</span><span>发布账号</span><span>发布时间</span><span>素材状态</span><span>状态</span></div>'+publishRows(false)+'</div></div>';

function copyContent(genId){
  var el=document.getElementById('content-'+genId);
  if(!el)return;
  navigator.clipboard.writeText(el.textContent||el.innerText).then(function(){toast('已复制到剪贴板');});
}
function logout(){apiFetch('/api/logout',{method:'POST'}).finally(function(){window.location.href='/login';});}
function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;');}
function formatTime(ts){
  if(!ts)return'';
  try{var d=new Date(ts);return d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}catch(e){return ts;}
}
function formatContent(text){
  if(!text)return'';
  return escapeHtml(text).replace(/^#\s+(.+)$/gm,'<strong style="font-size:18px">$1</strong>').replace(/^##\s+(.+)$/gm,'<strong style="font-size:16px">$1</strong>');
}
function toast(msg){
  var t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2400);
}

init();
